<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:#172b46}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:9px;background:#eef3f8;border-radius:10px 10px 0 0}button{background:white;border:1px solid #a8b9cc;border-radius:6px;color:#172b46;padding:6px 10px;cursor:pointer}button:focus-visible,.node:focus-visible{outline:3px solid #167a92}select{max-width:100%;padding:6px;color:#172b46;background:white;border:1px solid #a8b9cc;border-radius:6px}.report .card{stroke:#a15b10;stroke-width:3}.group-frame{opacity:.38}.secondary{padding-top:0;border-radius:0}#status{font-size:12px}svg{width:100%;height:480px;display:block;background:#f7faff;touch-action:none;cursor:grab;border:1px solid #dce5ee;border-radius:0 0 10px 10px}.group-frame{fill:#edf3fa;stroke:#c6d5e4;stroke-width:1;pointer-events:none}.hypothetical .group-frame{fill:#fff6e7;stroke:#d6b482}.hypothetical .group-label{fill:#75491c}.hypothetical .selected .card{fill:#fff1d5;stroke:#a9611d}.group-label{font:600 12px system-ui;fill:#415976;pointer-events:none}.node{cursor:pointer}.card{fill:white;stroke:#a4b7ca;stroke-width:1.5}.manager .card{fill:#e7f0fd;stroke:#41638a}.selected .card{stroke:#087f86;stroke-width:3;fill:#e4f7f4}.parent .card{stroke:#2b5cb1;stroke-width:3}.edge{stroke:#5e7896;stroke-width:2;stroke-dasharray:6 4;fill:none}.edge.active{stroke:#087f86;stroke-width:3}.name{font-weight:650;font-size:14px;fill:#152b47}.title{font-size:12px;fill:#425a74}@media(max-width:500px){svg{height:390px}}
</style>
<div class="toolbar"><select id="tree" aria-label="Reporting tree"></select><button id="minus" aria-label="Zoom out">−</button><button id="plus" aria-label="Zoom in">+</button><button id="fit">Fit to screen</button><span id="status" aria-live="polite"></span></div>
<div class="toolbar secondary"><button id="branch" disabled title="Hide or show descendants of the selected employee">Collapse reports</button><button id="save" title="Save the visible trees as a vector image">Download chart (SVG)</button></div>
<svg aria-label="Interactive suggested reporting chart" tabindex="0"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5e7896"/></marker></defs><g id="world"></g></svg>
<script>
"use strict";
const svg=document.querySelector('svg'), world=document.querySelector('#world'), ns='http://www.w3.org/2000/svg';
let payload, company, selection, nodes=new Map(), scale=1,x=0,y=0, drag=null, fitted=true, origin=null, pending=null, focusRevision, collapsed=new Set();
const tree=document.querySelector('#tree'),branch=document.querySelector('#branch');
function send(type,fields={}){parent.postMessage({isStreamlitMessage:true,type,...fields},origin||'*');}
function tag(name,attrs,parentNode){const e=document.createElementNS(ns,name);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));parentNode.append(e);return e;}
function draw(){world.setAttribute('transform','translate('+x+' '+y+') scale('+scale+')');svg.dataset.zoom=String(scale);document.querySelector('#status').textContent=Math.round(scale*100)+'% · Drag to pan';}
function size(){return svg.getBoundingClientRect();}
function fit(readable=false){if(!payload)return;const b=size(), g=payload.groups[Number(tree.value)-1] || {x:0,y:0,width:payload.width,height:payload.height};scale=Math.min(1.05,b.width/g.width,b.height/g.height)*.96;if(readable)scale=Math.max(.78,scale);x=Math.max(12,(b.width-g.width*scale)/2)-g.x*scale;y=Math.max(12,Math.min(22,(b.height-g.height*scale)/2))-g.y*scale;fitted=readable?"readable":"fit";draw();}
function zoom(f,cx=size().width/2,cy=size().height/2){let s=Math.max(.06,Math.min(3,scale*f));x=cx-(cx-x)*s/scale;y=cy-(cy-y)*s/scale;scale=s;fitted=false;draw();}
function focus(id){const n=nodes.get(id);if(!n)return;const b=size();scale=Math.max(scale,.8);x=b.width/2-(n.x+90)*scale;y=b.height/2-(n.y+35)*scale;fitted=false;draw();}
function highlight(id){selection=id;const p=payload.edges.find(e=>e[1]===id)?.[0], reports=new Set(payload.edges.filter(e=>e[0]===id).map(e=>e[1]));branch.disabled=!reports.size;branch.textContent=collapsed.has(id)?'Expand reports':'Collapse reports';world.querySelectorAll('.node').forEach(el=>{el.classList.toggle('selected',el.dataset.id===id);el.classList.toggle('parent',el.dataset.id===p);el.classList.toggle('report',reports.has(el.dataset.id));el.setAttribute('aria-pressed',String(el.dataset.id===id));});world.querySelectorAll('.edge').forEach(el=>el.classList.toggle('active',el.dataset.employee===id||reports.has(el.dataset.employee)));}
function pick(id){highlight(id);pending=crypto.randomUUID();send('streamlit:setComponentValue',{value:{id,event:pending},dataType:'json'});}
function render(){world.replaceChildren();nodes=new Map(payload.nodes.map(n=>[n.id,n]));const managers=new Set(payload.edges.map(e=>e[0])), hidden=new Set(), chosen=Number(tree.value);
 function hideReports(id){for(const [m,e] of payload.edges)if(m===id&&!hidden.has(e)){hidden.add(e);hideReports(e);}}
 for(const id of collapsed)hideReports(id);
 const visible=n=>n&&!hidden.has(n.id)&&(!chosen||n.group===chosen);
 for(const [i,g] of payload.groups.entries()){if(chosen&&i+1!==chosen)continue;tag('rect',{class:'group-frame',x:g.x,y:g.y,width:g.width,height:g.height,rx:12},world);tag('text',{class:'group-label',x:g.x+14,y:g.y+24},world).textContent=g.label;}
 for(const [m,e] of payload.edges){const a=nodes.get(m),b=nodes.get(e);if(!visible(a)||!visible(b))continue;const p=tag('path',{class:'edge',d:`M${a.x+90},${a.y+70} C${a.x+90},${a.y+91} ${b.x+90},${b.y-21} ${b.x+90},${b.y}`,'marker-end':'url(#arrow)'},world);p.dataset.employee=e;}
 for(const n of payload.nodes){if(!visible(n))continue;const g=tag('g',{class:'node'+(managers.has(n.id)?' manager':''),transform:`translate(${n.x} ${n.y})`,role:'button',tabindex:'0','aria-label':n.name+' — '+n.title},world);g.dataset.id=n.id;tag('rect',{class:'card',width:180,height:70,rx:9},g);tag('title',{},g).textContent=n.name+' — '+n.title;for(const [value,cls,yy,limit] of [[n.name,'name',26,22],[n.title,'title',48,26]])tag('text',{class:cls,x:10,y:yy},g).textContent=value.length>limit?value.slice(0,limit-1)+'…':value;g.addEventListener('click',()=>pick(n.id));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(n.id);}});}
}
addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='streamlit:render')return;origin=e.origin;const a=e.data.args;const changed=company!==a.company;payload=a.payload;if(changed){company=a.company;pending=null;collapsed.clear();tree.replaceChildren(new Option("All reporting trees","0"),...payload.groups.map((g,i)=>new Option(g.label,i+1)));tree.value="0";render();fit(true);focusRevision=a.focus_revision;}highlight(a.selected);if(focusRevision!==a.focus_revision){focusRevision=a.focus_revision;const n=nodes.get(a.selected);if(n){let id=n.id;while(id){collapsed.delete(id);id=payload.edges.find(e=>e[1]===id)?.[0];}tree.value=String(n.group);render();highlight(a.selected);focus(a.selected);}}send('streamlit:setFrameHeight',{height:Math.ceil(document.body.getBoundingClientRect().height)});});
document.querySelector('#save').onclick=()=>{
 const bounds=world.getBBox(), copy=svg.cloneNode(true), inset=18;
 copy.querySelector('#world').removeAttribute('transform');
 copy.setAttribute('xmlns',ns);copy.setAttribute('viewBox',`${bounds.x-inset} ${bounds.y-inset-25} ${bounds.width+2*inset} ${bounds.height+2*inset+25}`);
 copy.setAttribute('width',bounds.width+2*inset);copy.setAttribute('height',bounds.height+2*inset+25);
 const style=document.createElementNS(ns,'style');style.textContent=document.querySelector('style').textContent+' svg{width:auto;height:auto}';copy.prepend(style);
 const label=tag('text',{x:bounds.x,y:bounds.y-20,fill:'#172b46','font-family':'system-ui','font-size':14},copy);
 label.textContent='OrgLens | Synthetic data - unverified reporting proposals';
 const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(copy)],{type:'image/svg+xml'}));
 const link=document.createElement('a');link.href=url;link.download='orglens-reporting-chart.svg';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
tree.onchange=()=>{render();highlight(selection);fit(true);};branch.onclick=()=>{if(collapsed.has(selection))collapsed.delete(selection);else collapsed.add(selection);render();highlight(selection);};
document.querySelector('#plus').onclick=()=>zoom(1.22);document.querySelector('#minus').onclick=()=>zoom(1/1.22);document.querySelector('#fit').onclick=()=>fit();
svg.addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();const b=size();zoom(Math.exp(-e.deltaY*.004),e.clientX-b.left,e.clientY-b.top);},{passive:false});
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node')||e.button!==0)return;drag=[e.clientX-x,e.clientY-y];svg.setPointerCapture(e.pointerId);});
svg.addEventListener('pointermove',e=>{if(!drag)return;x=e.clientX-drag[0];y=e.clientY-drag[1];fitted=false;draw();});for(const ev of ['pointerup','pointercancel','lostpointercapture'])svg.addEventListener(ev,()=>drag=null);
svg.addEventListener('keydown',e=>{if(e.target!==svg)return;const d={ArrowLeft:[30,0],ArrowRight:[-30,0],ArrowUp:[0,30],ArrowDown:[0,-30]}[e.key];if(d){e.preventDefault();x+=d[0];y+=d[1];fitted=false;draw();}});
new ResizeObserver(()=>{if(fitted)fit(fitted==="readable");send('streamlit:setFrameHeight',{height:Math.ceil(document.body.getBoundingClientRect().height)});}).observe(document.body);
send('streamlit:componentReady',{apiVersion:1});
</script></html>
